<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L11,4 L0,8 z" fill="#3d3d3a"/>
    </marker>
    <marker id="arg" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L11,4 L0,8 z" fill="#8a8a84"/>
    </marker>
  </defs>

  <rect width="1500" height="900" fill="#ffffff"/>

  <!-- ===== panel frames ===== -->
  <rect x="34" y="70" width="640" height="700" rx="10" fill="#fbfaf8" stroke="#d6d3cc" stroke-width="2"/>
  <rect x="826" y="70" width="640" height="700" rx="10" fill="#fbfaf8" stroke="#d6d3cc" stroke-width="2"/>

  <text x="354" y="46" font-size="24" font-weight="700" text-anchor="middle" fill="#1c1c1a">PHONE</text>
  <text x="354" y="68" font-size="17" text-anchor="middle" fill="#75736d">used in the building, during the survey</text>
  <text x="1146" y="46" font-size="24" font-weight="700" text-anchor="middle" fill="#1c1c1a">LAPTOP</text>
  <text x="1146" y="68" font-size="17" text-anchor="middle" fill="#75736d">used afterwards, offline</text>

  <!-- ===== phone: three measurement sources ===== -->
  <text x="60" y="118" font-size="15" font-weight="600" fill="#8a4b26" letter-spacing="1.2">WHAT IT MEASURES</text>

  <rect x="60" y="134" width="588" height="96" rx="8" fill="#ffffff" stroke="#c8c4bb" stroke-width="1.6"/>
  <text x="80" y="164" font-size="19" font-weight="650" fill="#1c1c1a">1. Listens to access point beacons</text>
  <text x="80" y="190" font-size="16.5" fill="#55534e">Signal strength, channel, band, and every AP it can see.</text>
  <text x="80" y="213" font-size="16.5" fill="#55534e">Also how busy the channel is, and how many devices are connected.</text>

  <rect x="60" y="246" width="588" height="78" rx="8" fill="#ffffff" stroke="#c8c4bb" stroke-width="1.6"/>
  <text x="80" y="276" font-size="19" font-weight="650" fill="#1c1c1a">2. Pings the gateway</text>
  <text x="80" y="302" font-size="16.5" fill="#55534e">Delay, jitter and lost packets, measured idle and under load.</text>

  <rect x="60" y="340" width="588" height="78" rx="8" fill="#ffffff" stroke="#c8c4bb" stroke-width="1.6"/>
  <text x="80" y="370" font-size="19" font-weight="650" fill="#1c1c1a">3. Runs a speed test</text>
  <text x="80" y="396" font-size="16.5" fill="#55534e">Download and upload speed against one fixed website.</text>

  <!-- arrow down to storage -->
  <line x1="354" y1="418" x2="354" y2="466" stroke="#3d3d3a" stroke-width="2.2" marker-end="url(#ar)"/>

  <rect x="150" y="470" width="408" height="72" rx="8" fill="#f1ede4" stroke="#b9b2a4" stroke-width="1.8"/>
  <text x="354" y="500" font-size="19" font-weight="650" text-anchor="middle" fill="#1c1c1a">Saved on the phone straight away</text>
  <text x="354" y="524" font-size="16" text-anchor="middle" fill="#55534e">so a dead spot never loses a reading</text>

  <line x1="354" y1="542" x2="354" y2="590" stroke="#3d3d3a" stroke-width="2.2" marker-end="url(#ar)"/>

  <rect x="150" y="594" width="408" height="60" rx="8" fill="#ffffff" stroke="#c8c4bb" stroke-width="1.6"/>
  <text x="354" y="631" font-size="18" text-anchor="middle" fill="#1c1c1a">One file exported at the end of the session</text>

  <!-- repeated note -->
  <text x="354" y="700" font-size="16.5" text-anchor="middle" fill="#75736d">Repeated at all 27 grid points,</text>
  <text x="354" y="724" font-size="16.5" text-anchor="middle" fill="#75736d">three times each, morning and evening.</text>

  <!-- ===== bridge ===== -->
  <line x1="674" y1="624" x2="820" y2="624" stroke="#3d3d3a" stroke-width="2.6" marker-end="url(#ar)"/>
  <text x="747" y="612" font-size="16" text-anchor="middle" fill="#55534e">copied over</text>
  <text x="747" y="648" font-size="16" text-anchor="middle" fill="#55534e">after the walk</text>

  <!-- ===== laptop chain ===== -->
  <text x="852" y="118" font-size="15" font-weight="600" fill="#1b6b47" letter-spacing="1.2">WHAT HAPPENS TO THE DATA</text>

  <rect x="852" y="134" width="588" height="62" rx="8" fill="#ffffff" stroke="#c8c4bb" stroke-width="1.6"/>
  <text x="1146" y="172" font-size="19" font-weight="650" text-anchor="middle" fill="#1c1c1a">Loaded into a database</text>

  <line x1="1146" y1="196" x2="1146" y2="240" stroke="#3d3d3a" stroke-width="2.2" marker-end="url(#ar)"/>

  <rect x="852" y="244" width="588" height="82" rx="8" fill="#ffffff" stroke="#c8c4bb" stroke-width="1.6"/>
  <text x="1146" y="276" font-size="19" font-weight="650" text-anchor="middle" fill="#1c1c1a">Checked for patterns</text>
  <text x="1146" y="302" font-size="16.5" text-anchor="middle" fill="#55534e">does weak signal explain the slow points, or does a busy channel?</text>

  <line x1="1146" y1="326" x2="1146" y2="370" stroke="#3d3d3a" stroke-width="2.2" marker-end="url(#ar)"/>

  <rect x="852" y="374" width="588" height="112" rx="8" fill="#f1ede4" stroke="#b9b2a4" stroke-width="1.8"/>
  <text x="1146" y="406" font-size="19" font-weight="650" text-anchor="middle" fill="#1c1c1a">Every point gets a verdict</text>
  <text x="1146" y="434" font-size="16.5" text-anchor="middle" fill="#55534e">weak signal  ·  too crowded  ·  both  ·  nothing wrong</text>
  <text x="1146" y="462" font-size="16.5" text-anchor="middle" fill="#55534e">plus what should be done about it</text>

  <line x1="1146" y1="486" x2="1146" y2="530" stroke="#3d3d3a" stroke-width="2.2" marker-end="url(#ar)"/>

  <rect x="852" y="534" width="588" height="92" rx="8" fill="#ffffff" stroke="#c8c4bb" stroke-width="1.6"/>
  <text x="1146" y="566" font-size="19" font-weight="650" text-anchor="middle" fill="#1c1c1a">Two maps of the floor, side by side</text>
  <text x="1146" y="594" font-size="16.5" text-anchor="middle" fill="#55534e">one coloured by signal, one by actual speed.</text>
  <text x="1146" y="616" font-size="16.5" text-anchor="middle" fill="#55534e">Where they disagree is the interesting part.</text>

  <!-- simulation feed -->
  <rect x="852" y="662" width="588" height="86" rx="8" fill="#ffffff" stroke="#b6b2aa" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="1146" y="692" font-size="18" font-weight="650" text-anchor="middle" fill="#55534e">Simulation, run separately</text>
  <text x="1146" y="716" font-size="16" text-anchor="middle" fill="#75736d">holds signal fixed and adds competing devices,</text>
  <text x="1146" y="738" font-size="16" text-anchor="middle" fill="#75736d">to show crowding alone can cause the slowdown</text>
  <line x1="1146" y1="662" x2="1146" y2="630" stroke="#8a8a84" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arg)"/>
  <text x="1310" y="648" font-size="14.5" fill="#8a8a84">always labelled</text>

  <!-- caption -->
  <text x="750" y="812" font-size="18" font-weight="650" text-anchor="middle" fill="#1c1c1a">Figure 1. System architecture</text>
  <text x="750" y="840" font-size="16" text-anchor="middle" fill="#75736d">The phone does all the measuring. The laptop does all the analysis, afterwards. They never talk to each other during a survey.</text>
</svg>
