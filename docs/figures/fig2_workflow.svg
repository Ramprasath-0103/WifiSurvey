<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a2" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L11,4 L0,8 z" fill="#3d3d3a"/>
    </marker>
  </defs>
  <rect width="1500" height="720" fill="#ffffff"/>

  <text x="750" y="46" font-size="24" font-weight="700" text-anchor="middle" fill="#1c1c1a">One survey session, start to finish</text>

  <!-- step template: circle + box -->
  <!-- 1 -->
  <circle cx="98" cy="128" r="23" fill="#8a4b26"/>
  <text x="98" y="136" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
  <rect x="140" y="98" width="470" height="62" rx="8" fill="#ffffff" stroke="#c8c4bb" stroke-width="1.6"/>
  <text x="162" y="124" font-size="19" font-weight="650" fill="#1c1c1a">Arrive in a fixed time window</text>
  <text x="162" y="148" font-size="16.5" fill="#55534e">either 9 to 11 in the morning, or 7 to 9 at night</text>

  <!-- 2 -->
  <circle cx="98" cy="228" r="23" fill="#1b6b47"/>
  <text x="98" y="236" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
  <rect x="140" y="198" width="470" height="62" rx="8" fill="#eef4f0" stroke="#9ec0ae" stroke-width="1.8"/>
  <text x="162" y="224" font-size="19" font-weight="650" fill="#1c1c1a">Measure the control point first</text>
  <text x="162" y="248" font-size="16.5" fill="#55534e">the same spot every time, to catch a slow day on campus</text>

  <!-- 3 -->
  <circle cx="98" cy="328" r="23" fill="#8a4b26"/>
  <text x="98" y="336" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
  <rect x="140" y="298" width="470" height="62" rx="8" fill="#ffffff" stroke="#c8c4bb" stroke-width="1.6"/>
  <text x="162" y="324" font-size="19" font-weight="650" fill="#1c1c1a">Walk to a grid point</text>
  <text x="162" y="348" font-size="16.5" fill="#55534e">same spot, same way of standing, every visit</text>

  <!-- 4 -->
  <circle cx="98" cy="428" r="23" fill="#8a4b26"/>
  <text x="98" y="436" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
  <rect x="140" y="398" width="470" height="62" rx="8" fill="#ffffff" stroke="#c8c4bb" stroke-width="1.6"/>
  <text x="162" y="424" font-size="19" font-weight="650" fill="#1c1c1a">Press the button and wait</text>
  <text x="162" y="448" font-size="16.5" fill="#55534e">about 90 seconds, phone still, app left open</text>

  <!-- 5 -->
  <circle cx="98" cy="528" r="23" fill="#8a4b26"/>
  <text x="98" y="536" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
  <rect x="140" y="498" width="470" height="62" rx="8" fill="#ffffff" stroke="#c8c4bb" stroke-width="1.6"/>
  <text x="162" y="524" font-size="19" font-weight="650" fill="#1c1c1a">Do it three times, note anything odd</text>
  <text x="162" y="548" font-size="16.5" fill="#55534e">a crowd, a propped open door, a closed lab</text>

  <!-- 6 -->
  <circle cx="98" cy="628" r="23" fill="#8a4b26"/>
  <text x="98" y="636" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">6</text>
  <rect x="140" y="598" width="470" height="62" rx="8" fill="#ffffff" stroke="#c8c4bb" stroke-width="1.6"/>
  <text x="162" y="624" font-size="19" font-weight="650" fill="#1c1c1a">Export before leaving the building</text>
  <text x="162" y="648" font-size="16.5" fill="#55534e">and copy it off the phone the same day</text>

  <!-- connectors down the left column -->
  <line x1="98" y1="151" x2="98" y2="205" stroke="#3d3d3a" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="98" y1="251" x2="98" y2="305" stroke="#3d3d3a" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="98" y1="351" x2="98" y2="405" stroke="#3d3d3a" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="98" y1="451" x2="98" y2="505" stroke="#3d3d3a" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="98" y1="551" x2="98" y2="605" stroke="#3d3d3a" stroke-width="2" marker-end="url(#a2)"/>

  <!-- loop back 5 -> 3 -->
  <path d="M614 529 L668 529 L668 329 L614 329" fill="none" stroke="#8a8a84" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a2)"/>
  <text x="690" y="424" font-size="16" fill="#75736d">next point,</text>
  <text x="690" y="446" font-size="16" fill="#75736d">27 in total</text>

  <!-- right column: after the walk -->
  <line x1="614" y1="629" x2="700" y2="629" stroke="#3d3d3a" stroke-width="2.4"/>
  <path d="M700 629 L860 629 L860 200" fill="none" stroke="#3d3d3a" stroke-width="2.4" marker-end="url(#a2)"/>

  <rect x="880" y="98" width="560" height="96" rx="8" fill="#f1ede4" stroke="#b9b2a4" stroke-width="1.8"/>
  <text x="1160" y="132" font-size="20" font-weight="700" text-anchor="middle" fill="#1c1c1a">Back at the laptop</text>
  <text x="1160" y="160" font-size="16.5" text-anchor="middle" fill="#55534e">load the file into the database, run the analysis,</text>
  <text x="1160" y="182" font-size="16.5" text-anchor="middle" fill="#55534e">redraw the maps</text>

  <!-- the point of it all -->
  <rect x="880" y="240" width="560" height="300" rx="8" fill="#ffffff" stroke="#c8c4bb" stroke-width="1.6"/>
  <text x="1160" y="276" font-size="19" font-weight="700" text-anchor="middle" fill="#1c1c1a">What comes out of it</text>

  <rect x="910" y="298" width="500" height="52" rx="6" fill="#fbf7f3" stroke="#ddd5c9"/>
  <text x="930" y="330" font-size="17" fill="#1c1c1a">Signal fine, channel quiet</text>
  <text x="1390" y="330" font-size="17" font-weight="650" text-anchor="end" fill="#1b6b47">nothing wrong</text>

  <rect x="910" y="358" width="500" height="52" rx="6" fill="#fbf7f3" stroke="#ddd5c9"/>
  <text x="930" y="390" font-size="17" fill="#1c1c1a">Signal weak</text>
  <text x="1390" y="390" font-size="17" font-weight="650" text-anchor="end" fill="#8a4b26">too far from the AP</text>

  <rect x="910" y="418" width="500" height="52" rx="6" fill="#fbf7f3" stroke="#ddd5c9"/>
  <text x="930" y="450" font-size="17" fill="#1c1c1a">Signal fine, channel busy</text>
  <text x="1390" y="450" font-size="17" font-weight="650" text-anchor="end" fill="#a3352b">too crowded</text>

  <text x="1160" y="506" font-size="16.5" text-anchor="middle" fill="#55534e">and for the crowded ones, a warning that adding another</text>
  <text x="1160" y="528" font-size="16.5" text-anchor="middle" fill="#55534e">access point on the same channel would make it worse</text>

  <text x="1160" y="592" font-size="18" font-weight="650" text-anchor="middle" fill="#1c1c1a">Figure 2. Survey workflow</text>
  <text x="1160" y="620" font-size="16" text-anchor="middle" fill="#75736d">About five minutes per point including walking,</text>
  <text x="1160" y="642" font-size="16" text-anchor="middle" fill="#75736d">so roughly two and a half hours for one pass of the floor.</text>
</svg>
